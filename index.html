<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>doom</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    /* Fixed to the browser viewport; scrolls internally once the canvas
       (sized to fit its content, see ui/main.ts) grows past it. */
    #viewport { position: fixed; inset: 0; overflow: auto; }
    canvas { display: block; touch-action: none; }
    #start-audio {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 1;
      font: 12px monospace;
      color: #ccc;
      background: #262626;
      border: 1px solid #3a3a3a;
      border-radius: 4px;
      padding: 8px 16px;
      cursor: pointer;
      /* Inset highlight/shadow for a "dark button" bevel, plus a soft
         colored glow underneath so it reads as floating over the canvas —
         red while idle, green while running (see .running below). */
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.06),
        inset 0 -1px 0 rgba(0, 0, 0, 0.4),
        0 2px 6px rgba(0, 0, 0, 0.6),
        0 0 16px 2px rgba(210, 60, 60, 0.8);
      transition: box-shadow 0.4s ease;
    }
    #start-audio.running {
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.06),
        inset 0 -1px 0 rgba(0, 0, 0, 0.4),
        0 2px 6px rgba(0, 0, 0, 0.6),
        0 0 16px 2px rgba(70, 200, 100, 0.8);
    }
    #start-audio:disabled { opacity: 0.6; cursor: default; }
  </style>
</head>
<body>
  <button id="start-audio">start audio</button>
  <div id="viewport">
    <canvas id="stage"></canvas>
  </div>
  <script type="module" src="/ui/main.ts"></script>
</body>
</html>
